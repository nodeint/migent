# Workflow configuration. Validate with migent doctor --json after editing.
schema_version: 3
concurrency: 1

# Optional; defaults to the file name without .yaml.
id: reference

constraints:
  - Stay within the task.

# Optional prerequisite workflow from .migent/workflows/.
requires:
  workflow: plan

stages:
  - id: prepare
    description: Check the tree before the draft.
    # Without a role, run only these checks.
    verify:
      - pnpm build
    # Seconds for the whole verify list.
    verify_timeout: 1800

  - id: draft
    role: planner
    # Optional recipient for questions. Only human is supported; omit to disable questions.
    ask: human
    # Optional model name from config.yaml; omit to use the role's default.
    model: deep_reasoning
    # Provider options override model options.
    options:
      reasoning-effort: high
    depends_on: [prepare]
    # Only allowed when a route returns to this stage.
    max_revisions: 2
    instructions:
      - Write the draft.
    produces:
      artifact: draft.md

  - id: review
    role: reviewer
    depends_on: [draft]
    # Optional: continue a provider conversation from a stage in depends_on.
    session:
      resume_from: draft
    instructions:
      - Review the draft.
    # Run after agent completion. Put checks on every route to completion.
    verify:
      - pnpm test
    # Require verify. max_verify defaults to 3; timeout is seconds for the list.
    max_verify: 3
    verify_timeout: 900
    decision:
      # Agent guidance: choose one decision using when, then return its name.
      # navigate accepts a stage ID, complete, or a non-empty list of stage IDs.
      - approved:
          when: The work meets the task and required checks pass.
          navigate: complete
      - revise:
          when: Required fixes remain. List each fix and its impact.
          navigate: draft

  - id: check_docs
    role: reviewer
    depends_on: [review]
    # Optional: run only if matching Git paths changed since the session started.
    # Quote globs; paths are relative to the Git root, and ** spans directories.
    run_when:
      changed_paths:
        - "docs/**/*"
        - "**/README.md"
    instructions:
      - Review documentation changes.

# Publish a file matching the source stage's produces.artifact.
# Stage artifacts cannot be named verify.md.
outputs:
  - name: draft
    from_stage: draft
    artifact: draft.md
