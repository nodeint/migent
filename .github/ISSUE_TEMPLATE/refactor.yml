name: Refactor
description: Restructure code while preserving behavior and contracts.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What in the current structure makes the code hard to change, test, or understand.
    validations:
      required: true
  - type: textarea
    id: target
    attributes:
      label: Target structure
      description: Modules, ownership, or boundaries after the refactor.
    validations:
      required: true
  - type: textarea
    id: preserved
    attributes:
      label: Preserved behavior
      description: Commands, contracts, outputs, and tests that must stay unchanged.
      placeholder: |
        - ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Related work this refactor does not cover.
    validations:
      required: false
