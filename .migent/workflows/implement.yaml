schema_version: 4
id: implement
constraints:
  - Implement the task and any supplied approved plan. Do not redesign an approved plan.
  - Do not commit or push.
  - Stay within the task scope and any supplied plan.
stages:
  - id: prepare
    description: Check the tree is green before implementation starts.
    verify:
      - pnpm build
      - pnpm test
    verify_timeout: 1800
    depends_on: []
  - id: implement
    role: developer
    depends_on:
      - prepare
    max_revisions: 3
    instructions:
      - Read task.md and any prior session context. Implement the task, following the approved plan when one is supplied.
      - If the plan and the code disagree, stop and name the disagreement. Do not invent a design.
      - Run the relevant tests, including those named in any supplied plan. Fix failures your change caused before you report complete.
      - Write implementation.md in English. Record what changed, which tests ran and their results, and any deviation with its reason.
    produces:
      artifact: implementation.md
  - id: review_work
    role: reviewer
    depends_on:
      - implement
    instructions:
      - Read the prior plan, implementation.md, and the diff.
      - Check for missing plan items, extra scope, and tests that skip a case the plan requires.
    decision:
      - approved:
          when: The code matches the plan, the named tests passed, and no findings remain.
          navigate: complete
      - approved-with-note:
          when: The code matches the plan and the named tests passed. Only non-blocking findings remain; record them in review.md.
          navigate: complete
      - revise:
          when: Blocking issues, missing plan items, extra scope, or required test failures remain. List the files and changes still required in review.md.
          navigate: implement
    produces:
      artifact: review.md

outputs:
  - name: implementation
    from_stage: implement
    artifact: implementation.md
