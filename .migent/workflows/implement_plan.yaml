schema_version: 7
id: implement_plan

constraints:
  - Implement exactly one approved plan phase per session. Do not change the plan or mix phases.
  - Do not push, open a PR, rewrite history, or discard changes.
  - On blockers or exhausted revisions, preserve the diff; do not start a new phase over a dirty tree.

artifacts:
  phase_report:
    file: phase_report.md
    description: Phase ID, plan snapshot reference, branch and base HEAD, scope and changed paths, verification commands and results, deviations, and required References.
  phase_commit:
    file: phase_commit.md
    description: Original plan snapshot reference; a table of every phase with pending or complete status, commit SHA and phase report reference; next action.

stages:
  - id: implement_phase
    role: developer
    max_revisions: 3
    ask: human
    instructions:
      - Load the implement skill, plus the typescript, eslint, and testing skills when the work creates or changes `.ts`/`.tsx` files or tests, and the writing skill when it creates or changes Markdown.
      - Implement the selected phase; write phase_report.md.
      - Require a prior approved plan or phase_commit with a usable original plan snapshot, no blocking decisions, phase boundaries, and runnable verification.
      - On first entry, require a clean tree. Record the branch and base HEAD in phase_report.md before editing.
      - From a plan, initialize every phase as pending. From phase_commit, validate every completed phase's commit and report against the plan and current Git history; stop on missing, inconsistent, or reordered phase evidence.
      - Select the first pending phase in plan order and require its dependencies to be complete; stop if all phases are complete and direct the human to pr. Keep this selection and base HEAD throughout the session.
      - On revision or resume, read this session's previous phase_report and review findings. Continue only its phase diff with the recorded branch and HEAD unchanged; stop on unrelated changes. Do not require a clean tree for this case.
      - Run its Verify commands, and record the fields in the phase_report artifact description.
    artifacts: [phase_report]
    verify:
      - pnpm build

  - id: review_phase
    role: reviewer
    depends_on: [implement_phase]
    instructions:
      - Load the review and implement skills, plus the typescript, eslint, and testing skills when the work creates or changes `.ts`/`.tsx` files or tests, and the writing skill when the work creates or changes Markdown.
      - Review the selected phase against phase_report.md.
      - Check the recorded branch and base HEAD, phase dependencies and boundary, and a complete outcome without later repair. Treat plan gaps as blockers.
      - In the approval response, record the branch, base HEAD, and reviewed file paths with content hashes, modes, and deletions, including new files, so commit_phase can detect any later change. Exclude session artifacts from the code diff.
    decision:
      - approved:
          when: The selected phase is complete, verified, and has no required fixes.
          navigate: commit_phase
      - revise:
          when: Required fixes remain; report their evidence and impact.
          navigate: implement_phase
          artifacts:
            review:
              file: review.md
              description: Write only when the decision is revise; skip when approved.

  - id: commit_phase
    role: operator
    ask: human
    depends_on: [review_phase]
    instructions:
      - Read phase_report.md and review_phase's approval. Before a new commit, require HEAD to equal the recorded base, on the same branch with exactly the reviewed changes and no unrelated staged, unstaged, or untracked files. Stop on differences; changed code requires another review. Use only the recovery rule below when HEAD has already advanced.
      - Follow CONTRIBUTING.md for commit mechanics; do not push or open a PR. Stage files by name (never `git add -A` or `git commit -am`), inspect the staged diff, and exclude secrets and build output.
      - Make one commit for the selected phase without modifying code or amending earlier commits. If a hook changes files, stop and require another review.
      - On retry after a commit succeeded but artifact writing failed, recover that commit only if its parent is the recorded base HEAD, its contents exactly match the approval, and the tree is clean; never create a duplicate commit.
      - Verify the new commit has the recorded base HEAD as its parent, matches the approved changes, and leaves a clean tree. Only then mark this phase complete and write phase_commit.md using the fields in its artifact description; carry forward earlier phase rows and the original plan snapshot reference.
      - Set next action to implement_plan with the next pending phase ID, or pr when all phases are complete. Both downstream suggestions are unconditional; the artifact identifies the applicable one. The human starts the next session.
    artifacts: [phase_commit]

downstream:
  - workflow: implement_plan
    task: Implement the next pending phase of the plan.
  - workflow: pr
    task: Open a pull request for the completed plan.
