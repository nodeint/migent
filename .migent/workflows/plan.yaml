schema_version: 8
id: plan
constraints:
  - Plan only. Do not modify source code or change the approved design or acceptance criteria.

artifacts:
  plan:
    file: plan.md
    description: Reviewable implementation phases with boundaries, dependencies, verification, acceptance coverage, and required references.
  plan_comment:
    file: plan_comment.md
    required: false
    description: Non-blocking review comments for the implementer.

stages:
  - id: plan
    role: planner
    max_revisions: 3
    ask: human
    instructions:
      - Load the planning skill.
      - Require a working branch created from origin/next and an approved prior design; ask the human if either is missing or unsuitable.
      - Read prior artifacts and required References, including earlier inputs needed downstream. Report missing or inconsistent inputs and seek decisions on design gaps.
      - Write plan.md. Address prior review comments or explain why not.
      - Resolve substantive review findings when revising. Retain usable snapshot paths for prior artifacts and repository-relative paths for repository references.
    artifacts: [plan]

  - id: review_plan
    role: reviewer
    depends_on: [plan]
    instructions:
      - Load the review, planning skills.
      - Review plan.md against the approved design and its required inputs.
    decision:
      - approved:
          when: No substantive gaps or comments remain.
          navigate: complete
      - approved-with-comments:
          when: Only non-blocking comments remain, recorded in plan_comment.md.
          navigate: complete
          artifacts: [plan_comment]
      - revise:
          when: Substantive gaps require correction.
          navigate: plan

downstream:
  - workflow: implement_plan
    task: Implement the next pending phase of the approved plan.
