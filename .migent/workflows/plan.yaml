schema_version: 7
id: plan
constraints:
  - Plan only. Do not modify source code.
  - Do not change the approved design or the acceptance criteria; report gaps instead.

artifacts:
  plan:
    file: plan.md
    description: Design input, baseline, ordered tasks with design references, files, tests, and done conditions, acceptance mapping, documentation, and implementation risks.
  plan_comment:
    file: plan_comment.md
    required: false
    description: Non-blocking review comments for the implementer.

stages:
  - id: plan
    role: planner
    max_revisions: 3
    ask: human
    instructions:
      - Before starting, check that the workspace is on a working branch created from origin/next (the branch in the prior issue artifact when provided), not on main or next; otherwise ask the human how to proceed.
      - Follow the planning skill in .agents/skills/planning/SKILL.md and use its template for plan.md.
      - Require an approved prior design. When it is missing, or wrong or incomplete for a task, stop and ask the human instead of deciding the solution yourself.
      - Address the design's non-blocking comments when provided, or explain why not.
      - Read required references in the design and include the design, relevant comments, and earlier inputs needed by the implementer in plan.md References; stop and report missing or inconsistent required inputs.
      - Resolve substantive review findings when revising.
    artifacts: [plan]

  - id: review_plan
    role: reviewer
    depends_on:
      - plan
    instructions:
      - Review the plan against the prior design, the task, repository evidence, and the planning skill in .agents/skills/planning/SKILL.md and its template.
      - Check that the plan realizes the design without changing it, covers its full scope, and adds no out-of-scope work.
      - Check that each task cites the design parts it realizes, is independently verifiable, and is ordered by its dependencies.
      - Check that every acceptance criterion maps to tasks and tests with runnable commands.
      - Check that References identify the approved design and other inputs needed downstream with usable paths.
      - Report all substantive gaps together with their impact and required corrections.
      - Choose revise for substantive gaps, approved-with-comments for non-blocking comments, or approved when no comments remain.
      - Do not revise for style or formatting.
    decision:
      - approved:
          when: No substantive gaps or comments remain.
          navigate: complete
      - approved-with-comments:
          when: No substantive gaps remain, but non-blocking comments are recorded in plan_comment.md.
          navigate: complete
          artifacts: [plan_comment]
      - revise:
          when: Substantive gaps require correction.
          navigate: plan

downstream:
  - workflow: implement
    task: Implement the approved plan.
