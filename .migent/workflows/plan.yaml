schema_version: 7
id: plan
constraints:
  - Plan only. Do not modify source code or change the approved design or acceptance criteria.

artifacts:
  plan:
    file: plan.md
    description: Reviewable implementation phases with boundaries, dependencies, verification, acceptance coverage, and required references.
  plan_comment:
    file: plan_comment.md
    required: false
    description: Non-blocking review comments for the implementer.

stages:
  - id: plan
    role: planner
    max_revisions: 3
    ask: human
    instructions:
      - Require a working branch created from origin/next and an approved prior design; ask the human if either is missing or unsuitable.
      - Read prior artifacts and required References, including earlier inputs needed downstream. Report missing or inconsistent inputs and seek decisions on design gaps.
      - Write plan.md using .agents/skills/planning/SKILL.md and its template. Address prior review comments or explain why not.
      - Resolve substantive review findings when revising. Retain usable snapshot paths for prior artifacts and repository-relative paths for repository references.
    artifacts: [plan]

  - id: review_plan
    role: reviewer
    depends_on: [plan]
    instructions:
      - Review against the approved design, acceptance criteria, repository evidence, and the planning skill and template.
      - Check that each phase is one complete review unit, aims for one commit, and explains its boundary. Flag independently shippable parts grouped without justification.
      - Check dependency and risk ordering, confirmation of assumptions before use, and a coherent codebase after each phase. No phase may depend on later work to complete or verify its promised outcome.
      - Check that each phase includes its rules, enforcement, needed documentation, implementer inputs, runnable verification, and measurable completion criteria.
      - Check acceptance coverage against the actual phase scope and verification, including final integration. Flag missing or invented coverage and out-of-scope work.
      - Require no open decisions affecting scope, behavior, contracts, architecture, or phase boundaries, and usable References to all required inputs.
      - Report substantive findings together with impact and required corrections. Do not block on style or routine implementation choices.
    decision:
      - approved:
          when: No substantive gaps or comments remain.
          navigate: complete
      - approved-with-comments:
          when: Only non-blocking comments remain, recorded in plan_comment.md.
          navigate: complete
          artifacts: [plan_comment]
      - revise:
          when: Substantive gaps require correction.
          navigate: plan

downstream:
  - workflow: implement_plan
    task: Implement the next pending phase of the approved plan.
