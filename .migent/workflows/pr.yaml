schema_version: 7
id: pr

artifacts:
  pr:
    file: pr.md
    description: Branch, commit, pull request URL, CI result, and any failures or skipped checks.

stages:
  - id: open_pr
    role: operator
    ask: human
    instructions:
      - With phase_commit, require a clean tree and all phases committed in current history; otherwise stop.
      - Follow the create-pr skill in .agents/skills/create-pr/SKILL.md for committing, pushing, and opening the pull request against next.
      - Use prior implementation reports for the PR summary and verification, and the prior issue artifact for the closing reference when provided; otherwise use the diff and task.
      - Stop before merging; write pr.md.
    artifacts: [pr]
