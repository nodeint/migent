schema_version: 7
id: release

artifacts:
  release_notes:
    file: release_notes.md
    description: Version, SemVer reason, source commit, previous tag, and draft release notes.
  release_pr:
    file: release_pr.md
    description: Reviewed version and notes, PR URL, head commit, and CI results.
  release:
    file: release.md
    description: Version, tag, run and Release URLs, npm and main verification.

constraints:
  - Follow .agents/skills/release/SKILL.md for release rules and step requirements.

stages:
  - id: prepare
    role: operator
    max_revisions: 3
    ask: human
    instructions:
      - Follow only Prepare and review in the release skill; write release_notes.md.
      - On revisions, use review_notes findings to update the notes and local changelog.
    artifacts: [release_notes]

  - id: review_notes
    role: reviewer
    depends_on: [prepare]
    instructions:
      - Follow .agents/skills/review/SKILL.md and Prepare and review in the release skill to review release_notes.md and the local changelog diff against the source history.
      - Review content only; no release commit, PR, or CI is required yet.
    decision:
      - approved:
          navigate: open_pr
      - revise:
          when: Version or notes need correction; list all findings.
          navigate: prepare

  - id: open_pr
    role: operator
    ask: human
    depends_on: [prepare, review_notes]
    session:
      resume_from: prepare
    instructions:
      - Follow only Open PR and pass CI in the release skill using the approved version and notes; write release_pr.md.
      - If source history or reviewed content changes, stop and request a return to notes preparation and review before proceeding.
      - Stop before merging.
    artifacts: [release_pr]

  - id: publish
    role: operator
    ask: human
    depends_on: [open_pr]
    session:
      resume_from: open_pr
    instructions:
      - Follow Prerequisites and Merge and verify in the release skill using release_pr.md and the approved notes; write release.md.
    artifacts: [release]
