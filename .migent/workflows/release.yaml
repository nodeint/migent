schema_version: 8
id: release

artifacts:
  release_notes:
    file: release_notes.md
    description: Version, SemVer reason, source commit, previous tag, and draft release notes.
  release_pr:
    file: release_pr.md
    description: Reviewed version and notes, PR URL, head commit, and CI results.
  release:
    file: release.md
    description: Version, tag, run and Release URLs, npm and main verification.

stages:
  - id: prepare
    role: operator
    max_revisions: 3
    ask: human
    instructions:
      - Load the release skill; run only Prepare and review.
      - Prepare the release version and notes; write release_notes.md.
      - On revisions, use review_notes findings to update the notes and local changelog.
    artifacts: [release_notes]

  - id: review_notes
    role: reviewer
    depends_on: [prepare]
    instructions:
      - Load the review and release skills; review only Prepare and review.
      - Review release_notes.md and the local changelog diff against the source history.
      - Review content only; no release commit, PR, or CI is required yet.
    decision:
      - approved:
          navigate: open_pr
      - revise:
          when: Version or notes need correction; list all findings.
          navigate: prepare

  - id: open_pr
    role: operator
    ask: human
    depends_on: [prepare, review_notes]
    session:
      resume_from: prepare
    instructions:
      - Load the release skill; run only Open PR and pass CI.
      - Open the release PR and pass CI using the approved version and notes; write release_pr.md.
      - If source history or reviewed content changes, stop and request a return to notes preparation and review before proceeding.
      - Stop before merging.
    artifacts: [release_pr]

  - id: publish
    role: operator
    ask: human
    depends_on: [open_pr]
    session:
      resume_from: open_pr
    instructions:
      - Load the release skill; run only Prerequisites and Merge and verify.
      - Merge and verify the release using release_pr.md and the approved notes; write release.md.
    artifacts: [release]
