schema_version: 7
id: release

artifacts:
  release_pr:
    file: release_pr.md
    description: Proposed version with its SemVer reason, release notes, release PR URL, and CI result.
  release:
    file: release.md
    description: Version, tag, release.yml run URL and conclusion, GitHub Release URL, npm and main verification.

stages:
  - id: prepare
    role: operator
    max_revisions: 3
    ask: human
    instructions:
      - Follow the release skill in .agents/skills/release/SKILL.md up to opening the release pull request. Do not merge.
      - Use the version named in the task; otherwise propose one by the skill's version table and ask the human to confirm it before writing anything.
      - Write the release notes by the skill's release-note rules, checking them against git log since the previous tag.
      - Stop and ask when the working tree is not clean, the tag already exists, or build or tests fail.
      - When revising, apply every review finding to the notes or version and update the pull request.
    artifacts: [release_pr]

  - id: review_notes
    role: reviewer
    depends_on:
      - prepare
    instructions:
      - Review the release pull request diff and release_pr.md against the release skill.
      - Check that the version follows the version table for the recorded categories, and that no user-facing change since the previous tag is missing or miscategorized.
      - Check the notes follow the release-note rules, including PR links and migration steps for Breaking entries.
      - Check the release commit changes only CHANGELOG.md, packages/*/package.json, and pnpm-lock.yaml.
    decision:
      - approved:
          when: Version and notes follow the skill, and CI on the release pull request passes.
          navigate: publish
      - revise:
          when: The version, notes, or release commit need correction, or CI fails.
          navigate: prepare

  - id: publish
    role: operator
    ask: human
    depends_on:
      - review_notes
    instructions:
      - Ask the human to authorize the merge, showing the version, PR URL, and notes. Do not merge without that answer.
      - After authorization, follow the release skill from merging through watching release.yml and verifying npm and main.
      - Report a failing release.yml step and stop; never move a tag or force main.
    artifacts: [release]
