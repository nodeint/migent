<text x="1166" y="56" text-anchor="end" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#9198a1">WORKFLOW / PLAN + REVIEW</text>
<path d="M54 80.5H1166" stroke="#3d444d"/>
<text x="54" y="148" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="46" font-weight="780" letter-spacing="-2.8" fill="#ffffff">How Migent works</text>
<text x="54" y="180" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="16" fill="#b1bac4">One task moves through explicit roles: write the plan, review the artifact, then either revise or complete.</text>
