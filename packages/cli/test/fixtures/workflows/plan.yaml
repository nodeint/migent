schema_version: 7
id: plan
artifacts:
  plan:
    file: plan.md
stages:
  - id: plan
    role: planner
    max_revisions: 3
    depends_on: []
    artifacts: [plan]
  - id: review-plan
    role: reviewer
    depends_on:
      - plan
    decision:
      - approved:
          when: Choose approved according to the task.
          navigate: complete
      - revise:
          when: Choose revise according to the task.
          navigate: plan
constraints:
  - Do not write implementation code.
  - Do not infer decisions from review prose.
