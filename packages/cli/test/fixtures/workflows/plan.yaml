schema_version: 3
id: plan
description: Write and approve a plan before implementation.
stages:
  - id: plan
    role: planner
    max_revisions: 3
    depends_on: []
    produces:
      artifact: plan.md
  - id: review-plan
    role: reviewer
    depends_on:
      - plan
    decision:
      - approved:
          when: Choose approved according to the task.
          navigate: complete
      - revise:
          when: Choose revise according to the task.
          navigate: plan
outputs:
  - name: plan
    from_stage: plan
    artifact: plan.md
constraints:
  - Do not write implementation code.
  - Do not infer decisions from review prose.
