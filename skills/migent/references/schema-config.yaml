# Project configuration. Validate with migent doctor --json after editing.
schema_version: 2

# Named models can be shared by roles and stages.
# Use an available provider and model ID from migent provider list --json.
models:
  deep_reasoning:
    provider: grok
    model: grok-4.7
    # Optional thinking level; use a supported value, or omit for client default.
    # Do not also set the equivalent provider option or an OpenCode #variant.
    effort: high

  code_generation:
    provider: byteplus
    # Required for byteplus: the CLI client that runs this model.
    # Other client IDs: agy, claude-code, codex, grok.
    client: opencode
    model: coding-plan/deepseek-v4-pro

roles:
  planner:
    # A name from models, not a provider model ID.
    default_model: deep_reasoning
    # Shared instructions for this role.
    instructions:
      - Break the task into a reviewable plan.
    # Provider options override model options; stage options override these.
    options:
      reasoning-effort: medium
  reviewer:
    default_model: deep_reasoning

# config.local.yaml optionally overrides machine-specific settings; do not commit it.
# Mapping keys merge; scalars and lists replace shared values. Omit its schema_version.
# Use snake_case names and the provider's spelling for option keys.
# For effort errors or missing model mappings, follow doctor's diagnostics.
# Provider option keys:
# grok: reasoning-effort, max_turns, tools, disallowed_tools, permission_mode,
#       rules, allow, deny, sandbox.
# agy: effort, mode, agent, sandbox, skip_permissions.
# claude: effort, permission_mode, tools, allowed_tools, disallowed_tools,
#         max_budget_usd, fallback_model, append_system_prompt.
# codex: model_reasoning_effort; other keys may contain letters, digits, dots,
#        underscores, and hyphens.
# opencode: agent, thinking, variant.
