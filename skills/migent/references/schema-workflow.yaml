# A missing schema_version is 0. Commands refuse the file while it is older than this Migent.
schema_version: 2
concurrency: 1

# When id is omitted, the id is the file name without .yaml.
id: reference

constraints:
  - Stay within the task.

# requires.workflow names another file in .migent/workflows.
requires:
  workflow: plan

stages:
  - id: prepare
    description: Check the tree before the draft.
    # No role: Migent runs verify and does not start an agent.
    verify:
      - pnpm build
    verify_timeout: 1800
    depends_on: []

  - id: draft
    description: Write the draft.
    role: planner
    # model is a name under models in config.yaml, not a provider model id.
    model: planner
    # Override model options for this stage.
    options:
      reasoning-effort: high
    depends_on:
      - prepare
    # max_revisions is allowed only when a route returns to this stage.
    max_revisions: 2
    instructions:
      - Write the draft.
    produces:
      artifact: draft.md

  - id: review
    role: reviewer
    depends_on:
      - draft
    # resume_from must be one entry in depends_on. It continues that stage's provider session.
    session:
      resume_from: draft
    instructions:
      - Review the draft.
    # verify runs after status complete and must sit on every path to complete.
    # A stage artifact cannot be named verify.md.
    verify:
      - pnpm test
    # max_verify defaults to 3. verify_timeout is seconds for the whole list. Both require verify.
    max_verify: 3
    verify_timeout: 900
    # Route keys must match decision.values. A destination is a stage id, complete, or a non-empty list of stage ids.
    decision:
      values:
        - approved
        - revise
      routes:
        approved: complete
        revise: draft

  - id: check_docs
    description: Review documentation changes.
    role: reviewer
    depends_on:
      - review
    # run_when runs the stage only when a Git path changed since the session baseline matches one glob.
    # Quote every glob. Paths are relative to the Git repository root. ** spans directories.
    run_when:
      changed_paths:
        - "docs/**/*"
        - "**/README.md"
    instructions:
      - Review the documentation changes.

# An output artifact must match produces.artifact on from_stage.
outputs:
  - name: draft
    from_stage: draft
    artifact: draft.md
