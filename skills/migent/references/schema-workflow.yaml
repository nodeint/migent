# Annotated workflow example. For validation, session drafts, and refresh,
# see session-workflow.md. For project setup, see setup.md.
schema_version: 4
concurrency: 1

# Optional; defaults to the file name without .yaml.
id: reference

constraints:
  - Stay within the task.

stages:
  - id: prepare
    description: Check the tree before the draft.
    # Without a role, run only these checks.
    verify:
      - pnpm build
    # Seconds for the whole verify list.
    verify_timeout: 1800

  - id: draft
    role: planner
    # Optional recipient for questions. Only human is supported; omit to disable questions.
    ask: human
    # Optional model name from config.yaml; omit to use the role's default.
    model: deep_reasoning
    # Provider options override model options.
    options:
      reasoning-effort: high
    depends_on: [prepare]
    # Only allowed when a route returns to this stage.
    max_revisions: 2
    instructions:
      - Write the draft.
    produces:
      artifact: draft.md

  - id: review
    role: reviewer
    depends_on: [draft]
    # Optional: resume a completed role stage listed in depends_on.
    # Both stages must use compatible provider, model, and conversation options.
    session:
      resume_from: draft
    instructions:
      - Review the draft.
    # Run after agent completion. Put checks on every route to completion.
    verify:
      - pnpm test
    # These fields require verify. max_verify defaults to 3.
    max_verify: 3
    verify_timeout: 900
    decision:
      # Agent guidance: return one decision name. Add when only if the label needs clarification.
      # navigate accepts a stage ID, complete, or a non-empty list of stage IDs.
      - approved:
          navigate: check_docs
      - revise:
          when: Required fixes remain. List each fix and its impact.
          navigate: draft

  - id: check_docs
    role: reviewer
    depends_on: [review]
    # Optional: run only if matching Git paths changed since the session started.
    # Quote globs; paths are relative to the Git root, and ** spans directories.
    run_when:
      changed_paths:
        - "docs/**/*"
        - "**/README.md"
    instructions:
      - Review documentation changes.
    # A leaf stage without a decision completes naturally, including when skipped.

# Publish a file matching the source stage's produces.artifact.
# Stage artifacts cannot be named verify.md.
outputs:
  - name: draft
    from_stage: draft
    artifact: draft.md

# Optional suggestions, available after successful completion. No automatic dispatch.
# Each target workflow appears once. Keys name context at the destination; values name outputs above.
downstream:
  - workflow: implement
    task: Implement the approved draft.
    artifacts:
      plan: draft
